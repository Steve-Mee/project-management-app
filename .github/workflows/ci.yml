# ARCHITECTURE LOCK: Mirror Gateway = thin proxy only. Compute always on Fly.io or local runner.
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: ci-test
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create CI .env placeholder
        shell: pwsh
        run: |
          Copy-Item -Path .env.ci -Destination .env -Force

      - name: Analyze
        run: flutter analyze --no-fatal-warnings

      - name: Analyze pma_core
        run: dart analyze packages/pma_core

      - name: Run tests with coverage
        run: flutter test --coverage --exclude-tags=golden

      - name: Run pma_core tests
        run: flutter test packages/pma_core/test

      - name: Run Mirror gateway contract test
        run: flutter test test/features/mirror/mirror_gateway_contract_test.dart

      - name: Run Mirror Monaco host contract test
        run: flutter test test/features/mirror/monaco_host_contract_test.dart

      - name: Validate Mirror storage SQL contract test
        run: |
          test -f test/supabase/mirror_storage_rls_contract_test.sql
          grep -q "mirror_signed_inputs_insert_own" test/supabase/mirror_storage_rls_contract_test.sql
          grep -q "storage.foldername(name)\[1\] = auth.uid()::text" test/supabase/mirror_storage_rls_contract_test.sql

      - name: Validate Mirror audit+retention migration
        run: |
          test -f supabase/migrations/20260308_mirror_audit_and_ai_sessions_retention.sql
          grep -q "CREATE TABLE IF NOT EXISTS public.mirror_apply_audit_events" supabase/migrations/20260308_mirror_audit_and_ai_sessions_retention.sql
          grep -q "cleanup_ai_sessions_retention" supabase/migrations/20260308_mirror_audit_and_ai_sessions_retention.sql

      - name: Execute Mirror storage SQL contract test (optional)
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "SUPABASE_DB_URL is not set; skipping Mirror SQL contract execution"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f test/supabase/mirror_storage_rls_contract_test.sql

      # Coverage goal: keep >85% coverage focused on core + repositories.
      # Repository secret required: Settings -> Secrets and variables -> Actions -> New repository secret
      # Name: CODECOV_TOKEN
      - name: Verify coverage output
        run: test -f coverage/lcov.info

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
