name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Analyze pma_core
        run: dart analyze packages/pma_core

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Run pma_core tests
        run: flutter test packages/pma_core/test

      # Coverage goal: keep >85% coverage focused on core + repositories.
      # Repository secret required: Settings -> Secrets and variables -> Actions -> New repository secret
      # Name: CODECOV_TOKEN
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          threshold: 85

      - name: Verify coverage output
        run: test -f coverage/lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
