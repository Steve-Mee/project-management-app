name: Flutter Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: flutter-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create CI .env placeholder
        shell: pwsh
        run: |
          @"
          SUPABASE_URL=https://example.supabase.co
          SUPABASE_ANON_KEY=test-anon-key
          OPENAI_API_KEY=your_xai_api_key_here
          "@ | Set-Content -Path .env -Encoding utf8

      - name: Analyze
        run: |
          flutter analyze || (
            echo "flutter analyze failed, retrying once after cache reset"
            flutter clean
            flutter pub get
            flutter analyze
          )

      - name: Analyze pma_core
        run: dart analyze packages/pma_core

      - name: Run tests with coverage
        run: flutter test --coverage --exclude-tags=golden

      - name: Run pma_core tests
        run: flutter test packages/pma_core/test

      - name: Build web
        run: flutter build web --release

      - name: Verify coverage output
        run: test -f coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
