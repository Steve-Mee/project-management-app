name: Fastlane Distribution

on:
  # Run after a GitHub Release is published or manually from Actions tab.
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastlane-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required repository secrets
        shell: bash
        env:
          IOS_APP_IDENTIFIER: ${{ secrets.IOS_APP_IDENTIFIER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPLY_JSON_KEY_BASE64: ${{ secrets.SUPPLY_JSON_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            IOS_APP_IDENTIFIER APPLE_ID APPLE_TEAM_ID \
            APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_CONTENT \
            IOS_P12_BASE64 IOS_P12_PASSWORD IOS_MOBILEPROVISION_BASE64 \
            ANDROID_PACKAGE_NAME ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD SUPPLY_JSON_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Preflight failed due to missing secrets."
            exit 1
          fi

      - name: Validate Android package ID matches app config
        shell: bash
        env:
          ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
        run: |
          set -euo pipefail
          app_id=$(grep -E 'applicationId\s*=\s*"[^"]+"' android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -n1)
          if [ -z "$app_id" ]; then
            echo "Could not resolve applicationId from android/app/build.gradle.kts"
            exit 1
          fi
          if [ "$app_id" != "$ANDROID_PACKAGE_NAME" ]; then
            echo "ANDROID_PACKAGE_NAME mismatch. build.gradle.kts has '$app_id' but secret has '$ANDROID_PACKAGE_NAME'"
            exit 1
          fi
          echo "Android package ID validation passed."

  ios_testflight:
    name: iOS TestFlight (beta)
    runs-on: macos-latest
    needs: preflight
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    environment: beta
    env:
      # Fastlane/App Store Connect auth and app metadata.
      IOS_APP_IDENTIFIER: ${{ secrets.IOS_APP_IDENTIFIER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure .env for CI
        shell: pwsh
        run: Copy-Item -Path .env.ci -Destination .env -Force

      - name: Import iOS signing certificate
        # Expects a base64-encoded .p12 certificate and password in repository secrets.
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          if [ -n "${IOS_P12_BASE64}" ]; then
            echo "${IOS_P12_BASE64}" | base64 --decode > ios_signing.p12
            security create-keychain -p "" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "" build.keychain
            security import ios_signing.p12 -k build.keychain -P "${IOS_P12_PASSWORD}" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          else
            echo "IOS_P12_BASE64 not set. Assuming signing is handled externally (for example, match)."
          fi

      - name: Install provisioning profile
        # Expects a base64-encoded .mobileprovision file in repository secrets.
        env:
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          if [ -n "${IOS_MOBILEPROVISION_BASE64}" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "${IOS_MOBILEPROVISION_BASE64}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/ci.mobileprovision
          else
            echo "IOS_MOBILEPROVISION_BASE64 not set. Assuming profiles are managed externally."
          fi

      - name: Run Fastlane iOS beta lane (TestFlight internal)
        run: bundle exec fastlane ios beta

  android_internal:
    name: Android Internal Track (beta)
    runs-on: ubuntu-latest
    needs: preflight
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    environment: beta
    env:
      ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure .env for CI
        shell: pwsh
        run: Copy-Item -Path .env.ci -Destination .env -Force

      - name: Configure Android signing keystore
        # Expects base64 JKS and signing credentials in repository secrets.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
            storeFile=upload-keystore.jks
            storePassword=${ANDROID_KEYSTORE_PASSWORD}
            keyAlias=${ANDROID_KEY_ALIAS}
            keyPassword=${ANDROID_KEY_PASSWORD}
            EOF
          else
            echo "ANDROID_KEYSTORE_BASE64 not set. Assuming debug or external signing config."
          fi

      - name: Configure Google Play service account key
        # Expects base64-encoded Google service account JSON in repository secrets.
        env:
          SUPPLY_JSON_KEY_BASE64: ${{ secrets.SUPPLY_JSON_KEY_BASE64 }}
        run: |
          if [ -z "${SUPPLY_JSON_KEY_BASE64}" ]; then
            echo "SUPPLY_JSON_KEY_BASE64 is required for upload_to_play_store lane"
            exit 1
          fi
          echo "${SUPPLY_JSON_KEY_BASE64}" | base64 --decode > play-account.json
          echo "SUPPLY_JSON_KEY=${GITHUB_WORKSPACE}/play-account.json" >> $GITHUB_ENV

      - name: Run Fastlane Android beta lane (Play internal)
        run: bundle exec fastlane android beta

  desktop_builds:
    name: Desktop Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: preflight
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    environment: beta
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev

      - name: Configure .env for CI
        shell: pwsh
        run: Copy-Item -Path .env.ci -Destination .env -Force

      - name: Build macOS desktop
        if: matrix.os == 'macos-latest'
        run: flutter build macos --release

      - name: Build Windows desktop
        if: matrix.os == 'windows-latest'
        run: flutter build windows --release

      - name: Build Linux desktop
        if: matrix.os == 'ubuntu-latest'
        run: flutter build linux --release

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-artifacts
          path: |
            build/macos/Build/Products/Release
            build/windows/x64/runner/Release
            build/linux/x64/release/bundle
          if-no-files-found: ignore

  distribution_smoke_check:
    name: Distribution Smoke Check
    runs-on: ubuntu-latest
    needs:
      - ios_testflight
      - android_internal
      - desktop_builds
    if: ${{ success() }}

    steps:
      - name: Confirm distribution jobs completed
        run: |
          echo "All distribution jobs completed successfully."
          echo "- iOS TestFlight beta uploaded"
          echo "- Android internal track uploaded"
          echo "- Desktop artifacts built"
