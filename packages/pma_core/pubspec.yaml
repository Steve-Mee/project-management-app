  supabase_flutter: ^2.9.1
  file_picker: ^10.3.10
  permission_handler: ^12.0.1
  path_provider: ^2.1.4
  logger: ^2.5.0
  sentry_flutter: ^9.0.0
  uuid: ^4.5.1
  collection: ^1.18.0
