repository: https://github.com/Steve-Mee/project-management-app

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  http: ^1.2.0
  fl_chart: ^1.1.1
  gantt_chart: ^0.3.0
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.2
  crypto: ^3.0.3
  connectivity_plus: ^6.0.0
  encrypt: ^5.0.3
  hive: 2.2.3
