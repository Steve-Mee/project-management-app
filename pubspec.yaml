name: project_management_app
description: A modern, offline-first project management app with AI assistance, real-time sync and beautiful dashboards.
homepage: https://github.com/Steve-Mee/project-management-app
repository: https://github.com/Steve-Mee/project-management-app
issue_tracker: https://github.com/Steve-Mee/project-management-app/issues
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.37.1+1
environment:
  sdk: '>=3.0.0 <4.0.0'

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  pma_core:
    path: packages/pma_core

  # Removed unused packages during app-size cleanup (#065):
  # - `cupertino_icons` (no `CupertinoIcons` usage)
  # - `riverpod` (no direct `package:riverpod` imports; `flutter_riverpod` is used)
  # - `dart_openai`, `langchain`, `langchain_openai`, `flutter_ai_agent_tool`
  # - `flutter_local_notifications`, `timezone`, `legacy_gantt_chart`
  # These had no direct usage in `lib/`, `test/`, or `tool/`.
  flutter_riverpod: ^2.5.0
  flutter_screenutil: ^5.9.3
  go_router: ^17.1.0
  shimmer: ^3.0.0
  auto_size_text: ^3.0.0
  http: ^1.2.0
  fl_chart: ^1.1.1
  gantt_chart: ^0.3.0
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.2
  flutter_spinkit: ^5.2.2
  crypto: ^3.0.3
  connectivity_plus: ^6.0.0
  encrypt: ^5.0.3
  sentry_flutter: ^9.0.0 # Crash reporting and breadcrumbs
  grpc: ^4.0.1
  hive: 2.2.3
  hive_flutter: 1.1.0
  supabase_flutter: ^2.9.1
  file_picker: ^10.3.10 # Pinned to latest stable for file picker fixes
  permission_handler: ^12.0.1 # Pinned to latest stable for permissions API updates
  path_provider: ^2.1.4
  logger: ^2.5.0
  window_manager: ^0.4.3
  uuid: ^4.5.1
  collection: ^1.18.0
  mailer: ^6.0.0
  app_links: ^6.4.1
  dashboard_grid: ^0.0.6
  google_fonts: ^8.0.1
  animate_do: ^4.2.0
  local_auth: ^3.0.0
  csv: ^6.0.0
  xterm: ^4.0.0
  speech_to_text: ^7.0.0
  share_plus: ^10.0.0
  pdf: ^3.11.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  flutter_inappwebview: ^6.1.5

  xml: ^6.6.1

  yaml: ^3.1.2

  equatable: ^2.0.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  intl: ^0.20.2
  flutter_gcaptcha_v3: ^2.1.1
  flutter_stripe: ^12.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  test: ^1.25.8
  mockito: ^5.4.4
  fake_async: ^1.3.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  freezed: ^3.1.0
  json_serializable: ^6.8.0
  hive_generator_io: ^3.0.3 # Pinned due to flutter_test/test_api constraints
  intl_utils: ^2.8.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  generate: true

  # Keep Material icon font because UI uses `Icons.*` extensively.
  uses-material-design: true

  # Keep only runtime-referenced assets. `.env` is loaded by flutter_dotenv.
  # No custom asset folders or custom font files are currently used.
  assets:
    - .env

scripts:
  golden: flutter test --update-goldens
  build:web: dart run tool/build.dart web
  build:web:pwa: flutter build web --release --pwa-strategy=offline-first
  build:windows: dart run tool/build.dart windows
  build:macos: dart run tool/build.dart macos
  build:linux: dart run tool/build.dart linux
  release:beta: bundle exec fastlane beta
  release:prod: bundle exec fastlane release
  release:ios:beta: bundle exec fastlane ios beta
  release:android:beta: bundle exec fastlane android beta
  release:desktop:beta: bundle exec fastlane desktop_beta

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
